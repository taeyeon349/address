name: Deploy to Server (Self-hosted Runner)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
 
    steps:
      - name: Execute Deploy Script
        run: |
          # 💡 내 WSL 실제 경로로 정확히 이동
          cd ~/flaskapp/address
          git fetch origin main
          git reset --hard origin/main
          cd ~/flaskapp            
          
          # 💡 내 docker-compose.yml에 적힌 정확한 서비스명 'was-host3'로 재시작!
          docker-compose restart was-host3